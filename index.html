<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Wobble</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="pause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
  <div id="stats">
    <div id="hearts" aria-label="Lives"></div>
    <div id="score">0</div>
    <div id="lvl"></div>
  </div>
  <div id="sound">
    <input id="volume" type="range" min="0" max="100" step="1" aria-label="Volume">
    <button id="mute" aria-label="Mute"></button>
  </div>
</div>
<div id="banner" aria-live="polite"></div>
<div id="overlay" hidden></div>
<div id="fps" hidden></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
